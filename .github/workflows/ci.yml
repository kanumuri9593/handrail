name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Dogfood — scan this repo
        run: python -m handrail scan . --fail-on high
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pip package works from outside the repo
        run: |
          python -m pip install --quiet .
          cd "$RUNNER_TEMP" && handrail --version && handrail scan "$GITHUB_WORKSPACE" --fail-on high
      - name: npm package works from outside the repo
        run: |
          cd npm && npm pack --silent
          mkdir "$RUNNER_TEMP/npmt" && cd "$RUNNER_TEMP/npmt" && npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/npm/handrail-ai-*.tgz
          npx handrail --version && npx handrail scan "$GITHUB_WORKSPACE" --fail-on high
