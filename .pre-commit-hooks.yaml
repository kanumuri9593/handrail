- id: agentscan
  name: agentscan (agent config risks)
  description: Block commits that add dangerous coding-agent settings or committed keys
  entry: scanner/agentscan.py --fail-on high --min-severity medium
  language: script
  pass_filenames: true
  files: (AGENTS\.md|CLAUDE\.md|GEMINI\.md|\.cursorrules|\.windsurfrules|mcp\.json|\.claude/|\.cursor/|\.github/copilot-instructions\.md)
